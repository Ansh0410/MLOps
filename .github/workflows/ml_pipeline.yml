name: Tourism ML Pipeline

# Manual execution from GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # STEP 1: Download public source code.
      - name: Checkout public repository
        uses: actions/checkout@v4

      # STEP 2: Configure Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # STEP 3: Install dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # STEP 4: Verify source-code files.
      - name: Verify project files
        run: |
          test -f data_register.py
          test -f prep.py
          test -f train.py
          test -f evaluate.py
          test -f mlflow_tracking.py

      # STEP 5: Securely retrieve the private dataset.
      - name: Checkout private dataset
        uses: actions/checkout@v4
        with:
          repository: Ansh0410/tourism-data-private
          ref: main
          token: ${{ secrets.TOURISM_DATA_TOKEN }}
          path: private-data
          persist-credentials: false

      # STEP 6: Place CSV where our Python script expects it.
      - name: Prepare dataset
        run: |
          test -f private-data/tourism.csv
          cp private-data/tourism.csv tourism.csv
          echo "Dataset successfully retrieved."

      # STEP 7: Execute dataset registration.
      - name: Register dataset
        run: |
          python data_register.py

      # STEP 8: Verify registration artifact.
      - name: Verify registration result
        run: |
          test -f artifacts/dataset_metadata.json
          echo "Dataset registration completed successfully."

      # STEP 9: Remove local dataset copies.
      - name: Clean up customer data
        if: always()
        run: |
          rm -f tourism.csv
          rm -rf private-data
