name: Tourism ML Pipeline

# Run manually from GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Retrieve public source code.
      - name: Checkout public repository
        uses: actions/checkout@v4

      # 2. Configure Python environment.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install required Python libraries.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 4. Download the dataset securely.
      - name: Checkout private dataset
        uses: actions/checkout@v4
        with:
          repository: Ansh0410/tourism-data-private
          ref: main
          token: ${{ secrets.TOURISM_DATA_TOKEN }}
          path: private-data
          persist-credentials: false

      # 5. Copy dataset to expected input location.
      - name: Prepare dataset
        run: |
          test -f private-data/tourism.csv
          cp private-data/tourism.csv tourism.csv

      # 6. Register and validate original dataset.
      - name: Register dataset
        run: python data_register.py

      # 7. Clean data and create train/test splits.
      - name: Preprocess dataset
        run: python prep.py

      # 8. Train and compare candidate models.
      - name: Train models
        run: python train.py

      # 9. Evaluate selected model on test data.
      - name: Evaluate model
        run: python evaluate.py

      # 10. Log experiment information to MLflow.
      - name: Track experiments
        run: python mlflow_tracking.py

      # 11. Check that important outputs exist.
      - name: Verify pipeline outputs
        run: |
          test -f artifacts/dataset_metadata.json
          test -f artifacts/models/best_tourism_model.joblib
          test -f artifacts/models/model_comparison.csv
          echo "ML pipeline completed successfully."

      # 12. Remove customer-level data from runner.
      - name: Clean up customer data
        if: always()
        run: |
          rm -f tourism.csv
          rm -rf private-data
          rm -rf artifacts/processed
